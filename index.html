<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>THE CRADLE</title>

  <style>
    body {
      margin: 0;
      background: #110d18;
      color: #e9dfce;
      font-family: Georgia, serif;
      text-align: center;
    }

    header {
      padding: 110px 20px;
    }

    h1 {
      font-size: 52px;
      letter-spacing: 6px;
      color: #c5a574;
    }

    p {
      line-height: 1.9;
      color: #c9bfd0;
    }

    .button {
      display: inline-block;
      margin-top: 35px;
      padding: 14px 35px;
      border: 1px solid #c5a574;
      color: #c5a574;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      background: #c5a574;
      color: #110d18;
    }
  </style>
</head>

<body>

  <header>
    <p>✦ THE WORLD OF BIG MOTHER ✦</p>

    <h1>THE CRADLE</h1>

    <p>
      A Gothic Fantasy Character Archive
      <br>
      선택받은 아이들의 기록
    </p>

    <a class="button" href="#archive">
      ENTER THE ARCHIVE
    </a>
  </header>

  <section id="archive">
    <h2>CHARACTER ARCHIVE</h2>
    <p>곧 캐릭터 도감이 공개됩니다.</p>
  </section>

</html>
